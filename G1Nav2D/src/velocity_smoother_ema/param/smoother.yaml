alpha_v: 0.2 # 0.2 by default
alpha_w: 0.2 # 0.2 by default
raw_cmd_topic: "cmd_vel" # raw_cmd_vel by default
cmd_topic: "cmd_vel_smooth" # cmd_vel by default
cmd_rate: 30.0 # 30.0 Hz by default
raw_timeout: 0.3333333333333333 # no longer than the previous 10 ticks / 30 Hz watchdog
acc_lim_x: 0.3 # m/s^2; also bounds lateral EMA changes
acc_lim_theta: 0.5 # rad/s^2; matches the existing navigation safety profile
