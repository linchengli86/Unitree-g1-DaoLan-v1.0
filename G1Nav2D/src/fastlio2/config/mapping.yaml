map_frame: map
local_frame: local
body_frame: body
imu_topic: /livox/imu
livox_topic: /livox/lidar

local_rate: 20.0
loop_rate: 1.0
lio_builder:
  det_range: 50.0    # 从100.0改为50.0，适合室内环境
  cube_len: 200.0    # 从500.0改为200.0，减少内存占用
  resolution: 0.1    # 从0.2改为0.1，提高建图精度
  move_thresh: 1.2   # 从1.5改为1.2，更频繁地更新局部地图
  align_gravity: true
  imu_ext_rot: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  imu_ext_pos: [-0.011, -0.02329, 0.04412]

loop_closure:
  activate: true
  rad_thresh: 0.2
  dist_thresh: 1.0
  unfilter_rad_thresh: 0.1
  unfilter_dist_thresh: 0.2
  time_thresh: 30.0
  loop_pose_search_radius: 2.0
  loop_pose_index_thresh: 20
  submap_resolution: 0.2
  submap_search_num: 25
  loop_icp_thresh: 0.1

